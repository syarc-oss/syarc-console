[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/core",
    "apps/admin",
    "apps/platforms",
    "apps/surveillance",
        "apps/supply",
        "apps/pecuniary",
        "apps/library", "apps/agriculture", "apps/conferencing", "apps/hangman", "apps/cooking", "apps/meshlink", "apps/wordgame", "apps/calendar",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-sessions = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# Link against libsqlcipher (system pkg) so the pecuniary pool can open an
# encrypted database; plain databases still work through the same library.
libsqlite3-sys = { version = "0.30", features = ["sqlcipher"] }
argon2 = "0.5"
minijinja = { version = "2", features = ["json"] }
async-trait = "0.1"
time = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
incremental = true
