{% extends "base.html" %}
{% block title %}Hangman Game{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Hangman</h4>
                    <span class="badge bg-warning text-dark">Default App</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <!-- Game Graphics -->
                        <div class="col-md-6 text-center">
                            <svg id="hangman-svg" height="250" width="200" class="border bg-light rounded">
                                <!-- Base -->
                                <line x1="20" y1="230" x2="180" y2="230" style="stroke:black;stroke-width:4" />
                                <line x1="50" y1="230" x2="50" y2="20" style="stroke:black;stroke-width:4" />
                                <line x1="50" y1="20" x2="120" y2="20" style="stroke:black;stroke-width:4" />
                                <line x1="120" y1="20" x2="120" y2="50" style="stroke:black;stroke-width:4" />

                                <!-- Body Parts (Hidden by default) -->
                                <circle id="part-0" cx="120" cy="70" r="20" style="stroke:black;stroke-width:3; fill:none; display:none;" />
                                <line id="part-1" x1="120" y1="90" x2="120" y2="150" style="stroke:black;stroke-width:3; display:none;" />
                                <line id="part-2" x1="120" y1="100" x2="90" y2="130" style="stroke:black;stroke-width:3; display:none;" />
                                <line id="part-3" x1="120" y1="100" x2="150" y2="130" style="stroke:black;stroke-width:3; display:none;" />
                                <line id="part-4" x1="120" y1="150" x2="90" y2="190" style="stroke:black;stroke-width:3; display:none;" />
                                <line id="part-5" x1="120" y1="150" x2="150" y2="190" style="stroke:black;stroke-width:3; display:none;" />
                            </svg>

                            <div class="mt-2">
                                <span class="badge bg-danger" id="lives-badge">6 Lives Left</span>
                            </div>
                        </div>

                        <!-- Game Info & Controls -->
                        <div class="col-md-6">
                            <h5 class="text-center" id="word-display">_ _ _ _ _</h5>
                            <div class="text-center mb-3 text-muted">Hint: Could be any word</div>

                            <!-- Keyboard -->
                            <div id="keyboard" class="d-flex flex-wrap gap-1 justify-content-center">
                                <!-- Generated by JS -->
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="d-grid">
                        <button class="btn btn-primary" onclick="initGame()">Restart Game</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Win/Loss Modal -->
<div class="modal fade" id="gameModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Game Over</h5>
            </div>
            <div class="modal-body text-center">
                <h3 id="modalMessage"></h3>
                <p id="revealWrap">The word was: <strong id="revealWord" class="text-primary"></strong></p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="initGame()">Play Again</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script>
    const fallbackWords = [
        "PYTHON", "FASTAPI", "DATABASE", "SECURITY", "DEVELOPER",
        "ALGORITHM", "BROWSER", "SERVER", "ROUTER", "TEMPLATE",
        "VARIABLE", "FUNCTION", "SESSION", "COOKIES", "INTERFACE"
    ];

    let selectedWord = "";
    let guessedLetters = [];
    let mistakes = 0;
    const maxMistakes = 6;

    async function pickWord() {
        try {
            const resp = await fetch('/hangman/api/get-word');
            if (!resp.ok) throw new Error('bad status');
            const data = await resp.json();
            if (data.word && /^[A-Z]+$/.test(data.word)) return data.word;
            throw new Error('bad word');
        } catch (e) {
            return fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
        }
    }

    async function initGame() {
        // Reset state
        mistakes = 0;
        guessedLetters = [];
        selectedWord = await pickWord();

        // Reset UI
        updateLives();
        updateWordDisplay();
        resetHangmanDrawing();
        generateKeyboard();

        // Hide modal if open
        const modalEl = document.getElementById('gameModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
    }

    function updateWordDisplay() {
        const display = selectedWord
            .split('')
            .map(letter => guessedLetters.includes(letter) ? letter : '_')
            .join(' ');
        document.getElementById('word-display').textContent = display;

        // Check Win
        if (!display.includes('_')) {
            gameOver(true);
        }
    }

    function generateKeyboard() {
        const keyboardDiv = document.getElementById('keyboard');
        keyboardDiv.innerHTML = '';

        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            const btn = document.createElement('button');
            btn.textContent = letter;
            btn.className = 'btn btn-sm btn-outline-dark';
            btn.onclick = () => handleGuess(letter, btn);
            keyboardDiv.appendChild(btn);
        }
    }

    function handleGuess(letter, btnElement) {
        if (guessedLetters.includes(letter) || mistakes >= maxMistakes) return;

        guessedLetters.push(letter);
        btnElement.disabled = true;

        if (selectedWord.includes(letter)) {
            btnElement.classList.remove('btn-outline-dark');
            btnElement.classList.add('btn-success');
            updateWordDisplay();
        } else {
            btnElement.classList.remove('btn-outline-dark');
            btnElement.classList.add('btn-danger');
            mistakes++;
            updateLives();
            drawPart(mistakes - 1);

            if (mistakes >= maxMistakes) {
                gameOver(false);
            }
        }
    }

    function drawPart(partIndex) {
        const part = document.getElementById(`part-${partIndex}`);
        if (part) part.style.display = 'block';
    }

    function resetHangmanDrawing() {
        for (let i = 0; i < maxMistakes; i++) {
            const part = document.getElementById(`part-${i}`);
            if (part) part.style.display = 'none';
        }
    }

    function updateLives() {
        document.getElementById('lives-badge').textContent = `${maxMistakes - mistakes} Lives Left`;
    }

    function gameOver(isWin) {
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const revealWord = document.getElementById('revealWord');

        if (isWin) {
            modalTitle.textContent = "You Won!";
            modalTitle.className = "modal-title text-success";
            modalMessage.textContent = "You guessed it! Want to play another game?";
        } else {
            modalTitle.textContent = "You Lost!";
            modalTitle.className = "modal-title text-danger";
            modalMessage.textContent = "Better luck next time.";
        }

        revealWord.textContent = selectedWord;
        revealWord.parentElement.style.display = isWin ? 'none' : 'block';

        const myModal = new bootstrap.Modal(document.getElementById('gameModal'));
        myModal.show();
    }

    // Physical keyboard support
    document.addEventListener('keydown', (e) => {
        if (e.keyCode >= 65 && e.keyCode <= 90) { // A-Z
            const letter = e.key.toUpperCase();
            // Find corresponding button and click it
            const buttons = Array.from(document.getElementById('keyboard').children);
            const btn = buttons.find(b => b.textContent === letter);
            if (btn && !btn.disabled) {
                btn.click();
            }
        }
    });

    // Start on load
    initGame();
</script>
{% endblock %}
