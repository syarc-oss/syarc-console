{% extends "base.html" %}
{% block title %}Categories — Admin{% endblock %}
{% block content %}
<h2 class="mb-3">App categories</h2>
<div class="row">
  <div class="col-md-6">
    <table class="table table-hover bg-white shadow-sm">
      <thead><tr><th>Name</th><th>Slug</th><th>Apps</th><th></th></tr></thead>
      <tbody>
      {% for c in categories %}
        <tr>
          <td>{{ c.name }}</td>
          <td><code>{{ c.slug }}</code></td>
          <td>{{ c.app_count }}</td>
          <td class="text-end">
            <form method="post" action="/admin/categories/{{ c.id }}/delete" class="d-inline">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="col-md-4">
    <div class="card shadow-sm"><div class="card-body">
      <h5 class="card-title">New category</h5>
      <form method="post" action="/admin/categories">
        <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
        <button class="btn btn-primary" type="submit">Create</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
