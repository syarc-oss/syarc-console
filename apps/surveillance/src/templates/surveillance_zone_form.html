{% extends "base.html" %}

{% block title %}{{ zone.name if zone else "New Zone" }} - Surveillance{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/surveillance/">Surveillance</a></li>
        <li class="breadcrumb-item active">{{ zone.name if zone else "New Zone" }}</li>
    </ol>
</nav>

<h2>{{ "Edit Zone" if zone else "New Zone" }}</h2>

<div class="card">
    <div class="card-body">
        <form method="post" action="{{ '/surveillance/zone/' ~ zone.id ~ '/edit' if zone else '/surveillance/zone/new' }}">
            <div class="mb-3">
                <label for="name" class="form-label">Zone Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       value="{{ zone.name if zone else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="2">{{ zone.description if zone else '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> {{ "Update" if zone else "Create" }} Zone
            </button>
            <a href="/surveillance/" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
