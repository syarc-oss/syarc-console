{% extends "base.html" %}

{% block title %}New Stock Portfolio - Pecuniary{% endblock %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/pecuniary">Pecuniary</a></li>
            <li class="breadcrumb-item"><a href="/pecuniary/stocks/select">Stocks</a></li>
            <li class="breadcrumb-item active">New Portfolio</li>
        </ol>
    </nav>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><h4>Create New Stock Portfolio</h4></div>
                <div class="card-body">
                    <form action="/pecuniary/stocks/portfolio/new" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Portfolio Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required
                                   placeholder="e.g., My Retirement Fund">
                        </div>
                        <div class="mb-3">
                            <label for="broker" class="form-label">Default Broker</label>
                            <input type="text" class="form-control" id="broker" name="broker" value="Default"
                                   placeholder="e.g., Fidelity, Schwab">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/pecuniary/stocks/select" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Portfolio</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
