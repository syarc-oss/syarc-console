{% extends "base.html" %}

{% block title %}Add Transaction{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">Add New Transaction</h3>
                    
                    <form id="transactionForm" action="/pecuniary/stocks/add" method="post">
                        <input type="hidden" name="portfolio_id" value="{{ portfolio_id }}">
                        <input type="hidden" name="next" value="/pecuniary/stocks/?portfolio_id={{ portfolio_id }}">
                        
                        <div class="mb-3">
                            <label for="symbol" class="form-label">Symbol</label>
                            <input type="text" class="form-control form-control-lg" id="symbol" name="symbol" placeholder="e.g. AAPL" required style="text-transform: uppercase;">
                        </div>

                        <div class="mb-3">
                            <label for="broker" class="form-label">Broker</label>
                            <input type="text" class="form-control" id="broker" name="broker" placeholder="e.g. Fidelity, Robinhood" required value="Default">
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label">Type</label>
                            <select class="form-select form-select-lg" id="type" name="type" required>
                                <option value="BUY">Buy</option>
                                <option value="SELL">Sell</option>
                                <option value="DIVIDEND">Dividend</option>
                                <option value="FEE">Fee</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="transaction_date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="transaction_date" name="transaction_date" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="shares" class="form-label">Shares</label>
                                <input type="number" step="any" class="form-control" id="shares" name="shares" placeholder="0.00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="price_per_share" class="form-label">Price per Share</label>
                                <input type="number" step="any" class="form-control" id="price_per_share" name="price_per_share" placeholder="0.00">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="total_value" class="form-label fw-bold">Total Value ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="number" step="any" class="form-control" id="total_value" name="total_value" placeholder="0.00">
                            </div>
                            <div class="form-text">Auto-calculated from Shares × Price. Enter manually to override (e.g., for fees or NAV adjustments).</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" id="saveBtn" class="btn btn-primary btn-lg">Save Transaction</button>
                            <a href="/pecuniary/stocks/?portfolio_id={{ portfolio_id }}" class="btn btn-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('transaction_date').value = today;

    // Track if user manually modified the total field
    let totalManuallyModified = false;

    // Auto-calculate total value when shares and price per share are entered
    function calculateTotal() {
        const sharesInput = document.getElementById('shares');
        const priceInput = document.getElementById('price_per_share');
        const totalInput = document.getElementById('total_value');

        const shares = parseFloat(sharesInput.value);
        const pricePerShare = parseFloat(priceInput.value);
        const currentTotal = parseFloat(totalInput.value) || 0;

        console.log(`Calculation check - shares: ${shares}, price: ${pricePerShare}, currentTotal: ${currentTotal}, manualModified: ${totalManuallyModified}`);

        // Only auto-calculate if:
        // 1. Both shares and price are valid numbers
        // 2. User hasn't manually modified the total field
        // 3. OR total is empty (0)
        if (!isNaN(shares) && !isNaN(pricePerShare) && shares > 0 && pricePerShare > 0) {
            if (!totalManuallyModified || currentTotal === 0) {
                const calculatedTotal = shares * pricePerShare;
                totalInput.value = calculatedTotal.toFixed(2);
                console.log(`Auto-calculated total: ${shares} × ${pricePerShare} = ${totalInput.value}`);
            } else {
                console.log(`Skipping auto-calculation - user manually entered total: ${currentTotal}`);
            }
        }
    }

    // Mark total as manually modified when user types in it
    document.getElementById('total_value').addEventListener('input', function() {
        const value = parseFloat(this.value) || 0;
        // Only mark as manually modified if user entered a non-zero value
        if (value > 0) {
            totalManuallyModified = true;
            console.log('Total field manually modified - will respect this value');
        } else {
            totalManuallyModified = false;
            console.log('Total cleared - will auto-calculate again');
        }
    });

    // Reset manual modification flag when shares or price changes if total is 0
    function checkIfCanResetManualFlag() {
        const currentTotal = parseFloat(document.getElementById('total_value').value) || 0;
        if (currentTotal === 0) {
            totalManuallyModified = false;
            console.log('Reset manual flag - total is 0');
        }
    }

    document.getElementById('shares').addEventListener('input', function() {
        checkIfCanResetManualFlag();
        calculateTotal();
    });
    document.getElementById('price_per_share').addEventListener('input', function() {
        checkIfCanResetManualFlag();
        calculateTotal();
    });

    // Handle form submission with JavaScript
    document.getElementById('transactionForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Only calculate total if user hasn't manually entered one
        const shares = parseFloat(document.getElementById('shares').value) || 0;
        const pricePerShare = parseFloat(document.getElementById('price_per_share').value) || 0;
        const totalInput = document.getElementById('total_value');
        const currentTotal = parseFloat(totalInput.value) || 0;

        // Auto-calculate only if total is 0 and shares/price are valid
        if (currentTotal === 0 && shares > 0 && pricePerShare > 0) {
            const calculatedTotal = shares * pricePerShare;
            totalInput.value = calculatedTotal.toFixed(2);
            console.log(`Auto-calculated before submit: ${shares} × ${pricePerShare} = ${totalInput.value}`);
        } else {
            console.log(`Using manual total: ${currentTotal}`);
        }

        const formData = new FormData(this);
        const submitBtn = document.getElementById('saveBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        fetch('/pecuniary/stocks/add', {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: new URLSearchParams(formData)
        })
        .then(response => {
            if (response.ok) {
                return response.json().catch(() => ({ success: true }));
            }
            throw new Error(`HTTP ${response.status}`);
        })
        .then(data => {
            if (data.success) {
                alert('Transaction saved successfully!');
                // Reset form
                document.getElementById('transactionForm').reset();
                document.getElementById('transaction_date').value = today;
                document.getElementById('broker').value = 'Default';
            } else {
                alert('Failed to save transaction');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error saving transaction: ' + error.message);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Save Transaction';
        });
    });
</script>
{% endblock %}
